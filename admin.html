<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Inscripciones · Piatúa Ñampy Trail Running</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#faf6f6; --ink:#1d0f12; --text:#3a2a2e; --muted:#7d6b70; --line:#efe3e5; --head:#f6ecee; --field:#e7d6da;
            --ok:#1e9e4a; --ok-soft:#dcf5e4; --ok-btn:#4cc074; --no:#e02d22; --no-soft:#fde4e2; --pend:#b26b00; --pend-soft:#fff0d6;
            --orange:#e8730c; --pink:#ecd8dc; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 'Inter', system-ui, sans-serif; color: var(--text); background: var(--bg); }
    h1, h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; letter-spacing: .01em; color: var(--ink); margin: 0; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 0; border-radius: 999px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .btn[disabled] { cursor: default; }

    /* Acceso */
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(384px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 32px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .login h2 { font-size: 1.7rem; text-transform: uppercase; }
    .login form { display: grid; gap: 16px; margin-top: 22px; }
    .login label { display: grid; gap: 8px; font-size: .88rem; font-weight: 600; color: #5a2f38; }
    .login input { padding: .85rem .9rem; border: 1px solid var(--field); border-radius: 10px; background: #fff; }
    .login input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,115,12,.15); }
    .login .btn { padding: .95rem; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; background: var(--orange); color: #fff; }
    .link { display: block; margin: 14px auto 0; background: none; border: 0; color: var(--muted); font-size: .85rem; text-decoration: underline; }
    .msg { margin: 12px 0 0; color: var(--no); font-weight: 600; font-size: .9rem; }
    .msg.ok { color: var(--ok); }

    /* Panel */
    .wrap { padding: 28px 24px 60px; max-width: 1900px; margin: 0 auto; }
    .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
    .top h1 { font-size: 2.6rem; text-transform: uppercase; margin-right: auto; }
    .top .who { color: var(--muted); }
    .btn--soft { background: var(--pink); color: var(--ink); padding: .7rem 1.25rem; font-size: 1rem; }
    .status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 20px; border-radius: 14px; border: 1px solid; margin-bottom: 20px; }
    .status.open { background: #ecfbf1; border-color: #bfeccd; }
    .status.closed { background: #fff1f0; border-color: #f6c8c4; }
    .status .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--ok); }
    .status.closed .dot { background: var(--no); }
    .status p { margin: 0; margin-right: auto; color: var(--muted); }
    .status p b { color: var(--ink); }
    .btn--red { background: var(--no); color: #fff; padding: .7rem 1.25rem; font-size: 1rem; }
    .btn--green { background: var(--ok); color: #fff; padding: .7rem 1.25rem; font-size: 1rem; }
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 20px; }
    .filters input, .filters select { height: 46px; padding: 0 1rem; border: 1px solid var(--field); border-radius: 12px; background: #fff; color: var(--ink); }
    .filters input { flex: 1 1 320px; }
    .filters select { flex: 0 1 auto; min-width: 190px; }
    .filters input:focus, .filters select:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
    .count { font-weight: 600; color: #5a2f38; white-space: nowrap; }
    .table { background: #fff; border-radius: 14px; border: 1px solid var(--line); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1500px; }
    th { text-align: left; padding: 14px 10px; background: var(--head); color: #5a2f38; font-weight: 600; white-space: nowrap; }
    td { padding: 12px 10px; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink); }
    td.nowrap { white-space: nowrap; }
    td.mail { max-width: 170px; word-break: break-all; }
    td.club { max-width: 260px; }
    .pill { display: inline-block; padding: .2rem .7rem; border-radius: 999px; font-size: .85rem; font-weight: 600; }
    .pill.aprobada { background: var(--ok-soft); color: var(--ok); }
    .pill.pendiente { background: var(--pend-soft); color: var(--pend); }
    .pill.rechazada { background: var(--no-soft); color: var(--no); }
    .sm { padding: .32rem .8rem; font-size: .85rem; border-radius: 8px; }
    .btn--orange { background: var(--orange); color: #fff; }
    .acts { display: grid; grid-template-columns: auto auto; gap: 8px; justify-content: start; }
    .acts .approve { grid-column: 1 / -1; justify-self: start; background: var(--ok-btn); color: #fff; }
    .acts .deny { background: var(--no); color: #fff; }
    .acts .approve[disabled] { background: #a9dfbb; }
    .acts .deny[disabled] { background: #f2a49e; }

    .icon { width: 34px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: var(--pink); color: #5a2f38; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }

    /* Ventanas */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(29,15,18,.55); display: grid; place-items: center; padding: 16px; }
    .dialog { width: min(520px, 100%); max-height: 92vh; overflow: auto; background: #fff; border-radius: 16px; padding: 24px; position: relative; }
    .dialog h2 { font-size: 1.8rem; margin-bottom: 6px; padding-right: 40px; }
    .dialog p { margin: .4rem 0; }
    .dialog .close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--pink); font-size: 1.1rem; }
    /* Comprobante desplegado bajo la fila (como Baños Run) */
    tr.photo-row > td { background: #f6e9ec; padding: 14px 10px 18px; }
    .photo-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .photo-head h3 { margin: 0 auto 0 0; font: 600 1.05rem 'Inter', sans-serif; color: #5a2f38; }
    .btn--chip { background: var(--pink); color: var(--ink); padding: .45rem .9rem; border-radius: 10px; font-size: .95rem; }
    .btn--chip:hover { background: #e3c9cf; }
    .photo-frame { display: flex; justify-content: center; }
    .photo-frame img { display: block; max-width: min(100%, 520px); max-height: 640px; width: auto; height: auto; background: #fff; border: 1px solid #e3cfd4; border-radius: 10px; }
    .photo-frame p { color: var(--muted); }
    .muted { color: var(--muted); font-size: .88rem; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: .75rem 1.2rem; border-radius: 10px; font-weight: 600; }
    @media (max-width: 700px) { .wrap { padding: 20px 12px 50px; } .top h1 { font-size: 2.1rem; } .filters select { flex: 1 1 45%; min-width: 0; } }
  </style>
</head>
<body>
  <!-- Acceso -->
  <div class="login-screen" id="loginView">
    <div class="login">
      <h2>Administración</h2>
      <form id="loginForm">
        <label>Correo<input type="email" id="loginEmail" autocomplete="username" required /></label>
        <label>Contraseña<input type="password" id="loginPass" autocomplete="current-password" required /></label>
        <button class="btn" id="loginBtn" type="submit">Entrar</button>
      </form>
      <button class="link" id="forgot" type="button">¿Olvidaste tu contraseña?</button>
      <p class="msg" id="loginMsg"></p>
    </div>
  </div>

  <!-- Panel -->
  <div class="wrap" id="appView" hidden>
    <header class="top">
      <h1>Inscripciones</h1>
      <span class="who" id="whoEmail"></span>
      <button class="btn btn--soft" id="logout">Cerrar sesión</button>
    </header>

    <section class="status open" id="status">
      <span class="dot"></span>
      <p id="statusText"><b>Inscripciones: ABIERTAS</b> — el formulario público está activo.</p>
      <button class="btn btn--red" id="toggleOpen">Cerrar inscripciones</button>
    </section>

    <section class="filters">
      <input type="search" id="search" placeholder="Buscar nombre, cédula o email..." />
      <select id="fEstado" aria-label="Estado">
        <option value="">Todos los estados</option><option value="pendiente">Pendientes</option><option value="aprobada">Aprobados</option><option value="rechazada">Negados</option>
      </select>
      <select id="fDist" aria-label="Distancia">
        <option value="">Todas las distancias</option><option>14K Jaguar</option><option>7K Armadillo</option>
      </select>
      <select id="fCat" aria-label="Categoría">
        <option value="">Todas las categorías</option><option>Juvenil</option><option>Senior</option><option>Máster A</option><option>Máster B</option><option>Supermáster</option>
      </select>
      <select id="fSexo" aria-label="Sexo">
        <option value="">Damas y Varones</option><option value="Mujer">Damas</option><option value="Hombre">Varones</option>
      </select>
      <span class="count" id="count">0 inscrito(s)</span>
      <button class="btn btn--green" id="exportCsv">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 1.5L18.5 9H13zM8 12h2l1 2 1-2h2l-2 3.5 2 3.5h-2l-1-2-1 2H8l2-3.5z"/></svg>
        Descargar reporte
      </button>
    </section>

    <section class="table">
      <table>
        <thead>
          <tr><th>N°</th><th>Estado</th><th>Nombres</th><th>Cédula</th><th>F. Nac.</th><th>Distancia</th><th>Categoría</th><th>Sexo</th>
              <th>Teléfono</th><th>Email</th><th>Club/Provincia</th><th>Talla</th><th>Comprobante</th><th>Acciones</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>No hay inscripciones con estos filtros.</p>
    </section>
  </div>

  <!-- Ventana: foto del comprobante -->

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
